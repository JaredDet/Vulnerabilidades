<select class="rounded-xl bg-white p-2 text-sm text-neutral-700" [value]="selected()" (change)="select($event)">
  @for (repository of repositories(); track repository) {
    <option [value]="repository">{{ repository }}</option>
  }
</select>
<app-chart [title]="'top_archivos - hallazgos'" [horizontal]="true" [labels]="chart().labels" [series]="chart().series" />
