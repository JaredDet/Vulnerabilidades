<div class="grid grid-cols-2 gap-4">
  <app-chart kind="doughnut" [title]="'ecosistemas'" [labels]="doughnut().labels" [series]="doughnut().series" />
  @if (ecosystems(); as table) {
    <div class="min-w-0">
      <app-data-table [title]="'ecosistemas'" [columns]="ecosystemColumns()" [rows]="table.rows" [nullText]="nullText()" />
    </div>
  }
</div>
<app-chart [title]="'ecosistemas_por_repositorio'" [stacked]="true" [labels]="stacked().labels" [series]="stacked().series" />
