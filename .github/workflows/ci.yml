name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miner
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run pytest -q

  analyzer:
    name: Analyzer notebook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --project analyzer
      - run: uv run --project analyzer python analyzer/scripts/validate_notebook.py
      - run: uv run --project analyzer python -m unittest discover -s analyzer/tests
      - uses: actions/upload-artifact@v4
        with:
          name: analyzer-results
          path: analyzer/outputs/
          if-no-files-found: error

  security-tools:
    name: Container security tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create artifact directories
        run: mkdir -p artifacts/sbom artifacts/grype artifacts/codeql

      - name: Build Miner image with the analysis tools
        run: docker build --tag miner-ci miner

      - name: Generate CycloneDX SBOM with Syft
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE/miner:/workspace:ro"
          -v "$GITHUB_WORKSPACE/artifacts/sbom:/output"
          miner-ci
          syft scan dir:/workspace
          --output cyclonedx-json=/output/sbom.json

      - name: Scan the SBOM with Grype
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE/artifacts/sbom:/sbom:ro"
          -v "$GITHUB_WORKSPACE/artifacts/grype:/output"
          miner-ci
          grype sbom:/sbom/sbom.json
          --output json
          --file /output/vulnerabilities.json

      - name: Create a CodeQL database
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE/miner:/opt/src:ro"
          -v "$GITHUB_WORKSPACE/artifacts/codeql:/opt/results"
          miner-ci
          codeql database create --language=python /opt/results/database --source-root=/opt/src

      - name: Analyze with CodeQL
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE/miner:/opt/src:ro"
          -v "$GITHUB_WORKSPACE/artifacts/codeql:/opt/results"
          miner-ci
          codeql database analyze /opt/results/database codeql/python-queries:codeql-suites/python-code-scanning.qls --format=sarifv2.1.0 --output=/opt/results/results.sarif

      - name: Upload scanner reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: artifacts/
          if-no-files-found: warn
